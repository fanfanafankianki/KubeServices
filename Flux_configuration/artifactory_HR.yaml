apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: artifactory-custom
  namespace: staging
spec:
  interval: 1m
  chart:
    spec:
      chart: ./HelmCharts/artifactory_prod
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    artifactory:
      global:
        masterKey: "cefa6aa6c381a4bebbdfbd2e0c9cb51eebbee172266a0e4d04889cd5c0416c77"
        joinKey: "7f9d8b6a1c2e4f5d0a7b3c8e5f9a4d6c3e2f1a0b7c6d5e4f9a8b7c6e5f4d3a2b"
      initContainers:
        resources:
          requests:
            memory: "50Mi"
            cpu: "10m"
          limits:
            memory: "50Mi"
            cpu: "10m"
      router:
        requests:
          memory: "100Mi"
          cpu: "100m"
        limits:
          memory: "100Mi"
          cpu: "100m"
      frontend:
        requests:
          memory: "100Mi"
          cpu: "100m"
        limits:
          memory: "100Mi"
          cpu: "100m"
      metadata:
        requests:
          memory: "100Mi"
          cpu: "100m"
        limits:
          memory: "100Mi"
          cpu: "100m"
      event:
        requests:
          memory: "100Mi"
          cpu: "100m"
        limits:
          memory: "100Mi"
          cpu: "100m"
      observability:
        requests:
          memory: "100Mi"
          cpu: "100m"
        limits:
          memory: "100Mi"
          cpu: "100m"
      artifactory:
        resources:
          limits:
            memory: "1Gi"
            cpu: "400m"
          requests:
            memory: "1Gi"
            cpu: "400m"
