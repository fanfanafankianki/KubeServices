apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: sorry-cypress
  namespace: staging
spec:
  interval: 1m
  chart:
    spec:
      chart: ./HelmCharts/cypress_prod
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    api:
      resources:
        limits:
          cpu: 250m
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 512Mi
    dashboard:
      resources:
        limits:
          cpu: 250m
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 512Mi
    director:
      resources:
        limits:
          cpu: 250m
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 512Mi
    minio:
      resources:
        limits:
          cpu: 250m
          memory: 512Mi
        requests:
          cpu: 250m
          memory: 512Mi
    mongodb:
      resources:
        limits:
           cpu: 200m
           memory: 256Mi
        requests:
           cpu: 200m
           memory: 256Mi
      arbiter:
        resources:
          limits:
             cpu: 100m
             memory: 512Mi
          requests:
             cpu: 100m
             memory: 512Mi
